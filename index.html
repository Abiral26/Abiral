<style>
/* Layout: mobile-app shell (sticky header, bottom tab bar) that widens to a multi-column grid on desktop */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#12203B; --muted:#5B6678; --line:#DFE3EA;
  --crimson:#C8102E; --crimson-ink:#FFFFFF; --blue:#1B3F94; --gold:#E8A317; --ok:#1E8E5A; --warn:#B7791F;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#172033; --ink:#EDF0F6; --muted:#9AA6BB; --line:#2A3650;
  --crimson:#E5384F; --blue:#7EA0F5; --gold:#F2B640; --ok:#4CC38A; --warn:#E6B04D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#172033; --ink:#EDF0F6; --muted:#9AA6BB; --line:#2A3650;
  --crimson:#E5384F; --blue:#7EA0F5; --gold:#F2B640; --ok:#4CC38A; --warn:#E6B04D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
header .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--crimson);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo small{font:500 11px var(--font-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.iconbtn{position:relative;background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.badge{position:absolute;top:0;right:0;background:var(--crimson);color:var(--crimson-ink);font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
main{padding-block:16px}
.hero{background:var(--blue);color:#fff;border-radius:16px;padding:22px 20px;display:grid;gap:8px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,5vw,38px);line-height:1.08;max-width:18ch}
.hero p{margin:0;opacity:.88;max-width:44ch}
.hero svg{position:absolute;right:-10px;bottom:-14px;opacity:.16;width:170px}
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:14px 0 4px}
.search input{border:0;background:none;outline:0;padding:12px 0;flex:1;min-width:0}
.search:focus-within{border-color:var(--crimson)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:15px;font-weight:600;font-family:var(--font-body);letter-spacing:0;line-height:1.25}
.tile{aspect-ratio:1/1;max-width:100%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;cursor:pointer}
.tile svg{width:52%;height:52%}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--crimson);color:var(--crimson-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card .btn{margin-top:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.line{display:flex;gap:12px;align-items:center;min-width:0}
.line .t{width:64px;flex:none;border-radius:10px;overflow:hidden}
.line .t .tile{cursor:default}
.line .m{flex:1;min-width:0}
.line .m b{display:block;overflow-wrap:anywhere}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{background:none;border:0;width:34px;height:34px;cursor:pointer;font-size:18px}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--crimson)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:grid;gap:6px}.sum div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--crimson);background:color-mix(in srgb,var(--crimson) 7%,var(--surface))}
.opt input{accent-color:var(--crimson)}
.track{display:flex;gap:0;margin:6px 0}
.track div{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:20px}
.track div::before{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:var(--line)}
.track div::after{content:"";position:absolute;top:0;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--line)}
.track .on{color:var(--ink);font-weight:600}.track .on::before,.track .on::after{background:var(--ok)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:6px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:500;position:relative}
nav.tabs a[aria-current="page"]{color:var(--crimson)}
nav.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:500;max-width:90vw}
.err{color:var(--crimson);font-size:13px;min-height:0}
.empty{text-align:center;padding:40px 16px;color:var(--muted);display:grid;gap:12px;justify-items:center}
footer.note{margin:28px 0 8px;text-align:center;color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:9px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
h2.sec{font-size:22px;margin:4px 0 12px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>

</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#home">Abiral <small>Nepal to USA</small></a>

<script>
(function(){
const P=[
{id:1,n:"Ilam Orthodox Black Tea",c:"Tea & Food",p:12.99,r:4.8,o:"Ilam, Nepal",i:"jar",a:"#7A2E1D",b:"#C06A3B",d:"Whole-leaf orthodox black tea from the hills of Ilam. Malty, floral, and bright. 100g tin."},
{id:2,n:"Timur Sichuan Pepper",c:"Spices",p:8.49,r:4.7,o:"Dhankuta, Nepal",i:"jar",a:"#8A1F2E",b:"#D94F5F",d:"Citrusy, numbing Himalayan pepper for achar, curries and momo dipping sauce. 50g."},
{id:3,n:"Jimbu Mountain Herb",c:"Spices",p:7.99,r:4.6,o:"Humla, Nepal",i:"jar",a:"#2F5D3A",b:"#6FA06E",d:"Sun-dried Himalayan allium herb used to temper dal. Tastes like garlic and onion together. 30g."},
{id:4,n:"Momo Masala Blend",c:"Spices",p:5.99,r:4.9,o:"Kathmandu, Nepal",i:"bag",a:"#B8541A",b:"#F0A04B",d:"Ready ground blend for momo filling, jhol achar and chutney. 100g pouch."},
{id:5,n:"Chiya Masala",c:"Tea & Food",p:6.99,r:4.7,o:"Kathmandu, Nepal",i:"bag",a:"#8C5B1E",b:"#DDAA55",d:"Cardamom, ginger, clove and cinnamon for proper Nepali milk tea. 100g."},
{id:6,n:"Gundruk Fermented Greens",c:"Tea & Food",p:6.49,r:4.5,o:"Bhaktapur, Nepal",i:"bag",a:"#2D5030",b:"#7DA66F",d:"Traditional sun-dried fermented leafy greens for soup and achar. 150g."},

{id:8,n:"Lapsi Candy",c:"Tea & Food",p:4.99,r:4.4,o:"Lalitpur, Nepal",i:"bag",a:"#6E2A5A",b:"#B6679D",d:"Sweet and sour Nepali hog plum candy. A childhood favorite. 200g."},
{id:9,n:"Pashmina Shawl",c:"Clothing",p:59,r:4.9,o:"Kathmandu, Nepal",i:"cloth",a:"#1B3F94",b:"#5C86E0",d:"Handwoven cashmere-silk blend shawl, 70 x 200 cm. Soft, warm, light."},
{id:10,n:"Dhaka Topi",c:"Clothing",p:24,r:4.7,o:"Palpa, Nepal",i:"cloth",a:"#A02432",b:"#E2677A",d:"Traditional Nepali cap in handwoven dhaka fabric. Sizes M and L in the note at checkout."},
{id:11,n:"Hand-hammered Singing Bowl",c:"Handicrafts",p:49,r:4.8,o:"Patan, Nepal",i:"bowl",a:"#9A6A12",b:"#E6B94D",d:"Seven-metal bowl with wooden striker and cushion. 12 cm, deep resonant tone."},
{id:12,n:"Thangka Mandala Print",c:"Handicrafts",p:85,r:4.9,o:"Bhaktapur, Nepal",i:"mandala",a:"#7C1D2B",b:"#E0A12E",d:"Hand-painted mandala on cotton canvas with gold detail. 30 x 30 cm."},
{id:13,n:"Lokta Paper Journal",c:"Handicrafts",p:14.5,r:4.6,o:"Kavre, Nepal",i:"book",a:"#4D5B3C",b:"#9DB07F",d:"Handmade from Himalayan lokta bark. Acid-free, 120 pages, hand-stitched spine."},
{id:14,n:"Tilhari Beaded Necklace",c:"Jewelry",p:32,r:4.7,o:"Kathmandu, Nepal",i:"beads",a:"#B01E3A",b:"#F06F5C",d:"Red glass bead and gold-tone pote necklace worn at Tihar and Teej."},
{id:15,n:"Khukuri Letter Opener",c:"Gifts",p:19,r:4.5,o:"Dharan, Nepal",i:"blade",a:"#2A3446",b:"#6C7A93",d:"Mini brass-handled khukuri for the desk, with leather sheath. 18 cm."},
{id:16,n:"Prayer Flag Set",c:"Gifts",p:11,r:4.8,o:"Boudha, Nepal",i:"flag",a:"#1F5FA8",b:"#E8B730",d:"Five-color cotton lung ta flags, 25 flags on a 6 m string."}
];
const CATS=["All",...new Set(P.map(p=>p.c))];
const IC={
jar:'<rect x="30" y="14" width="40" height="12" rx="3"/><rect x="24" y="30" width="52" height="56" rx="10"/>',
bag:'<path d="M26 28h48l6 58H20z"/><path d="M38 28c0-12 24-12 24 0" fill="none" stroke="#fff" stroke-width="5" opacity=".7"/>',
cloth:'<path d="M14 24c14 10 28-10 36 0s26 10 36 0v52c-10 10-26 10-36 0s-22 10-36 0z"/>',
bowl:'<path d="M12 44h76c0 26-16 40-38 40S12 70 12 44z"/><rect x="30" y="86" width="40" height="6" rx="3"/>',
mandala:'<circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="5"/><circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="10" fill="#7C1D2B"/>',
book:'<rect x="22" y="14" width="56" height="72" rx="6"/><rect x="32" y="14" width="6" height="72" fill="#4D5B3C" opacity=".5"/>',
beads:'<g>'+Array.from({length:12},(_,k)=>{const t=k/12*Math.PI;return `<circle cx="${(50-36*Math.cos(t)).toFixed(1)}" cy="${(24+50*Math.sin(t)).toFixed(1)}" r="6.5"/>`}).join('')+'</g>',
blade:'<path d="M16 70L70 18l12 12L30 84z"/><rect x="62" y="12" width="10" height="26" rx="3" transform="rotate(45 67 25)" fill="#fff" opacity=".6"/>',
flag:'<path d="M10 30c26 12 54-12 80 0" fill="none" stroke="#fff" stroke-width="3"/><path d="M16 32h14l-7 20zM38 36h14l-7 20zM60 34h14l-7 20z"/><path d="M12 62c26 12 54-12 78 0" fill="none" stroke="#fff" stroke-width="3"/><path d="M18 64h14l-7 20zM42 66h14l-7 20zM64 62h14l-7 20z" opacity=".8"/>'
};
const art=p=>`<div class="tile" data-go="p-${p.id}" style="--a:${p.a};--b:${p.b}"><svg viewBox="0 0 100 100" fill="#fff" fill-opacity=".92" aria-hidden="true">${IC[p.i]}</svg></div>`;
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>'$'+Number(n).toFixed(2);
const stars=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));
let S={users:[],session:null,cart:[],orders:[],addr:null};
try{const x=JSON.parse(localStorage.getItem('abiral-v1')||'null');if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('abiral-v1',JSON.stringify(S))}catch(e){}};
const me=()=>S.users.find(u=>u.email===S.session);
const cartCount=()=>S.cart.reduce((a,c)=>a+c.qty,0);
const prod=id=>P.find(p=>p.id==id);
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2200)}
const STAT=["Placed","Packed","Shipped","Delivered"];
const SHIP={std:{n:"Standard, 3 to 5 days",p:5.99},exp:{n:"Express, 1 to 2 days",p:12.99}};
function totals(items,ship){const sub=items.reduce((a,i)=>a+i.price*i.qty,0);const sh=sub>=50&&ship==='std'?0:SHIP[ship].p;const tax=+(sub*0.07).toFixed(2);return{sub,sh,tax,total:sub+sh+tax}}
let q="",cat="All",authMode="in",next=null,qtyP=1;

const ICO={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',cart:'<path d="M3 4h2l2.2 11h10.6L20 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',orders:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',account:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-7 8-7s7 2 8 7"/>'};
function tabs(r){
  const cur=r.startsWith('p-')||r==='shop'?'home':r==='checkout'?'cart':(r.startsWith('order-')||r.startsWith('return-'))?'orders':r;

   `<a href="#${k}" ${cur===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg>${l}${k==='cart'&&cc?`<span class="badge" style="right:20%">${cc}</span>`:''}</a>`).join('');

function cardHTML(p){return `<div class="card">${art(p)}<div class="body"><h3>${esc(p.n)}</h3><span class="stars" aria-label="${p.r} out of 5">${stars(p.r)} <span class="muted">${p.r}</span></span><span class="price">${m(p.p)}</span><button class="btn sm" data-add="${p.id}">Add to cart</button></div></div>`}

  return L.length?L.map(cardHTML).join(''):`<div class="empty" style="grid-column:1/-1">No products match "${esc(q)}".<button class="btn alt sm" data-clear>Clear search</button></div>`;
}
function vHome(){
  app.innerHTML=`<section class="hero"><h1>Authentic Nepali goods, delivered across the US</h1><p>Tea, spices, pashmina and handicrafts sourced directly from makers in Nepal.</p>
  <svg viewBox="0 0 100 100" fill="#fff" aria-hidden="true"><path d="M0 100L35 30l12 18 18-34 35 86z"/></svg></section>

  <div class="chips" role="group" aria-label="Categories">${CATS.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('')}</div>
  <div class="grid" id="list">${listHTML()}</div>
  <footer class="note">Demo store. Sample products and mock payments only. No real charges.</footer>`;
}
function vProduct(id){
  const p=prod(id);if(!p)return vHome();
  app.innerHTML=`<p><a href="#home" class="muted">&larr; Back to shop</a></p><div class="two"><div class="card" style="border-radius:16px">${art(p)}</div>
  <div class="stack"><span class="pill">${esc(p.c)}</span><h2 style="font-size:28px">${esc(p.n)}</h2>
  <div><span class="stars">${stars(p.r)}</span> <span class="muted">${p.r} (sample rating)</span></div>
  <div class="price" style="font-size:26px">${m(p.p)}</div><p style="margin:0">${esc(p.d)}</p>
  <div class="muted">Made in ${esc(p.o)}. Ships from the US warehouse. Free standard shipping over $50.</div>
  <div class="row" style="justify-content:flex-start"><div class="qty"><button data-qp="-1" aria-label="Less">&minus;</button><span id="qp">${qtyP}</span><button data-qp="1" aria-label="More">+</button></div>
  <button class="btn" data-addq="${p.id}">Add to cart</button><button class="btn alt" data-buy="${p.id}">Buy now</button></div></div></div>
  <h2 class="sec" style="margin-top:26px">You may also like</h2><div class="grid">${P.filter(x=>x.c===p.c&&x.id!==p.id).concat(P.filter(x=>x.c!==p.c)).slice(0,4).map(cardHTML).join('')}</div>`;
}
function vCart(){
  if(!S.cart.length){app.innerHTML=`<h2 class="sec">Your cart</h2><div class="panel empty">Your cart is empty.<a class="btn" href="#home">Start shopping</a></div>`;return}
  const items=S.cart.map(c=>({...prod(c.id),qty:c.qty,price:prod(c.id).p}));const t=totals(items,'std');
  app.innerHTML=`<h2 class="sec">Your cart</h2><div class="two"><div class="panel">${items.map(i=>`<div class="line"><div class="t">${art(i)}</div><div class="m"><b>${esc(i.n)}</b><span class="muted">${m(i.p)} each</span></div>
  <div class="qty"><button data-cq="${i.id}" data-d="-1" aria-label="Less">&minus;</button><span>${i.qty}</span><button data-cq="${i.id}" data-d="1" aria-label="More">+</button></div></div>`).join('')}</div>
  <div class="panel"><div class="sum"><div><span>Subtotal</span><span>${m(t.sub)}</span></div><div><span>Shipping (standard)</span><span>${t.sh?m(t.sh):'Free'}</span></div><div><span>Estimated tax</span><span>${m(t.tax)}</span></div><div class="tot"><span>Total</span><span>${m(t.total)}</span></div></div>
  <button class="btn block" data-go="checkout">Checkout</button></div></div>`;
}
function vCheckout(){
  if(!S.cart.length)return location.hash='#cart';
  if(!me()){next='checkout';toast('Sign in to place your order');return location.hash='#account'}
  const u=me(),a=S.addr||{};
  const items=S.cart.map(c=>({...prod(c.id),qty:c.qty,price:prod(c.id).p}));
  const states="AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(' ');
  app.innerHTML=`<p><a href="#cart" class="muted">&larr; Back to cart</a></p><h2 class="sec">Checkout</h2><form id="co" class="two" novalidate>
  <div class="stack"><div class="panel"><h3>Delivery address</h3>
  <label class="f">Full name<input id="a-name" value="${esc(a.name||u.name)}" autocomplete="name"></label>
  <label class="f">Street address<input id="a-st" value="${esc(a.st||'')}" autocomplete="street-address"></label>
  <div class="cols"><label class="f">City<input id="a-city" value="${esc(a.city||'')}"></label>
  <label class="f">State<select id="a-state">${states.map(s=>`<option ${a.state===s?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <div class="cols"><label class="f">ZIP code<input id="a-zip" inputmode="numeric" maxlength="5" value="${esc(a.zip||'')}"></label>
  <label class="f">Phone<input id="a-ph" inputmode="tel" value="${esc(a.ph||'')}"></label></div></div>
  <div class="panel"><h3>Shipping</h3>${Object.entries(SHIP).map(([k,v],i)=>`<label class="opt"><input type="radio" name="ship" value="${k}" ${i===0?'checked':''}><span style="flex:1">${v.n}</span><b>${m(v.p)}</b></label>`).join('')}</div></div>
  <div class="stack"><div class="panel"><h3>Payment</h3><span class="muted">Mock payment. Use any 16 digits, e.g. 4242 4242 4242 4242.</span>
  <label class="f">Card number<input id="c-num" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19" autocomplete="cc-number"></label>
  <div class="cols"><label class="f">Expiry (MM/YY)<input id="c-exp" placeholder="12/29" maxlength="5"></label><label class="f">CVC<input id="c-cvc" inputmode="numeric" maxlength="4" placeholder="123"></label></div></div>
  <div class="panel"><h3>Order summary</h3>${items.map(i=>`<div class="row" style="flex-wrap:nowrap"><span style="min-width:0">${i.qty} &times; ${esc(i.n)}</span><span>${m(i.p*i.qty)}</span></div>`).join('')}<div class="sum" id="sumbox"></div>
  <div class="err" id="err" role="alert"></div><button class="btn block" type="submit">Pay and place order</button></div></div></form>`;
  const upd=()=>{const s=document.querySelector('input[name=ship]:checked').value;const t=totals(items,s);$('#sumbox').innerHTML=`<div><span>Subtotal</span><span>${m(t.sub)}</span></div><div><span>Shipping</span><span>${t.sh?m(t.sh):'Free'}</span></div><div><span>Estimated tax (7%)</span><span>${m(t.tax)}</span></div><div class="tot"><span>Total</span><span>${m(t.total)}</span></div>`};
  upd();document.querySelectorAll('input[name=ship]').forEach(r=>r.onchange=upd);
  $('#c-num').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();
  $('#c-exp').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v};
  $('#co').onsubmit=e=>{e.preventDefault();const g=i=>$('#'+i).value.trim();const err=t=>{$('#err').textContent=t};
    const addr={name:g('a-name'),st:g('a-st'),city:g('a-city'),state:g('a-state'),zip:g('a-zip'),ph:g('a-ph')};
    if(!addr.name||!addr.st||!addr.city)return err('Enter your name, street and city.');
    if(!/^\d{5}$/.test(addr.zip))return err('ZIP code must be 5 digits.');
    const num=g('c-num').replace(/\s/g,'');if(num.length!==16)return err('Card number must be 16 digits.');
    if(!/^(0[1-9]|1[0-2])\/\d\d$/.test(g('c-exp')))return err('Enter expiry as MM/YY.');
    if(!/^\d{3,4}$/.test(g('c-cvc')))return err('Enter the 3 or 4 digit CVC.');
    const ship=document.querySelector('input[name=ship]:checked').value,t=totals(items,ship);
    const o={id:'ABR-'+Math.random().toString(36).slice(2,7).toUpperCase(),uid:u.email,date:Date.now(),items:items.map(i=>({id:i.id,n:i.n,price:i.p,qty:i.qty})),...t,ship:SHIP[ship].n,addr,card:num.slice(-4),st:0,returns:[]};
    S.orders.unshift(o);S.addr=addr;S.cart=[];save();toast('Payment approved');location.hash='#order-'+o.id};
}
function vOrders(){
  if(!me()){next='orders';return vAccount()}
  const L=S.orders.filter(o=>o.uid===S.session);
  app.innerHTML=`<h2 class="sec">Your orders</h2>`+(L.length?`<div class="stack">${L.map(o=>`<a href="#order-${o.id}" class="panel" style="text-decoration:none;color:inherit"><div class="row"><b>${o.id}</b><span class="pill ${o.st===3?'ok':'warn'}">${STAT[o.st]}</span></div>
  <div class="muted">${new Date(o.date).toLocaleDateString()} &middot; ${o.items.reduce((a,i)=>a+i.qty,0)} items &middot; ${m(o.total)}</div>
  <div class="muted" style="overflow-wrap:anywhere">${o.items.map(i=>esc(i.n)).join(', ')}</div></a>`).join('')}</div>`:`<div class="panel empty">No orders yet.<a class="btn" href="#home">Shop now</a></div>`);
}
const retQty=(o,id)=>o.returns.reduce((a,r)=>a+(r.items.find(i=>i.id===id)?.qty||0),0);
function vOrder(id,justPlaced){
  const o=S.orders.find(x=>x.id===id&&x.uid===S.session);if(!o)return location.hash='#orders';
  const canRet=o.st===3&&o.items.some(i=>i.qty>retQty(o,i.id));
  app.innerHTML=`<p><a href="#orders" class="muted">&larr; All orders</a></p><div class="stack">
  <div class="panel"><div class="row"><h2>${o.id}</h2><span class="pill ${o.st===3?'ok':'warn'}">${STAT[o.st]}</span></div>
  <div class="track">${STAT.map((s,i)=>`<div class="${i<=o.st?'on':''}">${s}</div>`).join('')}</div>
  ${o.st<3?`<button class="btn alt sm" data-adv="${o.id}" style="justify-self:start">Demo: advance to ${STAT[o.st+1]}</button>`:''}
  <div class="muted">Placed ${new Date(o.date).toLocaleString()} &middot; ${esc(o.ship)}</div></div>
  <div class="two"><div class="panel"><h3>Items</h3>${o.items.map(i=>`<div class="line"><div class="t">${art({...prod(i.id)})}</div><div class="m"><b>${esc(i.n)}</b><span class="muted">${i.qty} &times; ${m(i.price)}${retQty(o,i.id)?` &middot; ${retQty(o,i.id)} returned`:''}</span></div><b>${m(i.price*i.qty)}</b></div>`).join('')}</div>
  <div class="stack"><div class="panel"><h3>Payment</h3><div class="sum"><div><span>Subtotal</span><span>${m(o.sub)}</span></div><div><span>Shipping</span><span>${o.sh?m(o.sh):'Free'}</span></div><div><span>Tax</span><span>${m(o.tax)}</span></div><div class="tot"><span>Total</span><span>${m(o.total)}</span></div></div><div class="muted">Card ending ${o.card}</div></div>
  <div class="panel"><h3>Ship to</h3><div>${esc(o.addr.name)}<br>${esc(o.addr.st)}<br>${esc(o.addr.city)}, ${esc(o.addr.state)} ${esc(o.addr.zip)}</div></div></div></div>
  <div class="panel"><h3>Returns</h3>${o.returns.map(r=>`<div class="row"><div><b>${r.id}</b> <span class="muted">${r.items.map(i=>i.qty+' &times; '+esc(prod(i.id).n)).join(', ')}</span><br><span class="muted">Reason: ${esc(r.reason)} &middot; Refund ${m(r.refund)}</span></div><div class="row"><span class="pill ${r.status==='Refunded'?'ok':'warn'}">${r.status}</span>${r.status!=='Refunded'?`<button class="btn alt sm" data-radv="${o.id}|${r.id}">Demo: advance</button>`:''}</div></div>`).join('')||'<span class="muted">No returns for this order.</span>'}
  ${canRet?`<a class="btn" href="#return-${o.id}" style="justify-self:start">Return items</a>`:o.st<3?'<span class="muted">Returns open once the order is delivered (30 day window).</span>':''}</div></div>`;
}
function vReturn(id){
  const o=S.orders.find(x=>x.id===id&&x.uid===S.session);if(!o||o.st<3)return location.hash='#orders';
  const L=o.items.filter(i=>i.qty>retQty(o,i.id));if(!L.length)return location.hash='#order-'+id;
  app.innerHTML=`<p><a href="#order-${id}" class="muted">&larr; Back to order</a></p><h2 class="sec">Return items</h2><form id="rf" class="panel" novalidate>
  ${L.map(i=>{const av=i.qty-retQty(o,i.id);return `<div class="line"><input type="checkbox" id="rc-${i.id}" aria-label="Return ${esc(i.n)}" style="accent-color:var(--crimson);width:20px;height:20px"><div class="m"><b>${esc(i.n)}</b><span class="muted">${m(i.price)} each, up to ${av}</span></div>
  <select id="rq-${i.id}" aria-label="Quantity" class="f" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">${Array.from({length:av},(_,k)=>`<option>${k+1}</option>`).join('')}</select></div>`}).join('')}
  <label class="f">Reason<select id="r-why"><option>Arrived damaged</option><option>Wrong item received</option><option>Not as described</option><option>Changed my mind</option><option>Other</option></select></label>
  <label class="f">Details (optional)<textarea id="r-note" rows="3"></textarea></label>
  <div class="err" id="err" role="alert"></div><button class="btn" type="submit">Submit return request</button></form>`;
  $('#rf').onsubmit=e=>{e.preventDefault();const it=L.filter(i=>$('#rc-'+i.id).checked).map(i=>({id:i.id,qty:+$('#rq-'+i.id).value}));
    if(!it.length)return $('#err').textContent='Select at least one item to return.';
    const refund=it.reduce((a,i)=>a+i.qty*o.items.find(x=>x.id===i.id).price,0);
    o.returns.push({id:'RET-'+Math.random().toString(36).slice(2,6).toUpperCase(),items:it,reason:$('#r-why').value,note:$('#r-note').value,status:'Requested',refund,date:Date.now()});
    save();toast('Return requested. Prepaid label will be emailed.');location.hash='#order-'+id};
}
function vAccount(){
  const u=me();
  if(u){const n=S.orders.filter(o=>o.uid===u.email).length;
    app.innerHTML=`<h2 class="sec">Account</h2><div class="panel"><h3>${esc(u.name)}</h3><div class="muted">${esc(u.email)}</div><div class="muted">${n} order${n===1?'':'s'}</div>
    <div class="row" style="justify-content:flex-start"><a class="btn" href="#orders">View orders</a><button class="btn alt" data-out>Sign out</button></div></div>
    <footer class="note">Demo store: accounts and orders are saved in this browser only.</footer>`;return}
  app.innerHTML=`<h2 class="sec">Welcome to Abiral</h2><div class="panel" style="max-width:440px;margin:0 auto"><div class="seg"><button data-auth="in" aria-pressed="${authMode==='in'}">Sign in</button><button data-auth="up" aria-pressed="${authMode==='up'}">Create account</button></div>
  <form id="af" class="stack" novalidate>${authMode==='up'?'<label class="f">Full name<input id="u-name" autocomplete="name"></label>':''}
  <label class="f">Email<input id="u-email" type="email" autocomplete="email"></label>
  <label class="f">Password<input id="u-pass" type="password" autocomplete="${authMode==='up'?'new-password':'current-password'}"></label>
  <div class="err" id="err" role="alert"></div><button class="btn block" type="submit">${authMode==='up'?'Create account':'Sign in'}</button></form></div>`;
  $('#af').onsubmit=e=>{e.preventDefault();const em=$('#u-email').value.trim().toLowerCase(),pw=$('#u-pass').value,err=t=>$('#err').textContent=t;
    if(!/^\S+@\S+\.\S+$/.test(em))return err('Enter a valid email.');if(pw.length<6)return err('Password needs at least 6 characters.');
    if(authMode==='up'){const nm=$('#u-name').value.trim();if(!nm)return err('Enter your name.');if(S.users.some(x=>x.email===em))return err('That email already has an account. Sign in instead.');S.users.push({email:em,name:nm,pw})}
    else{const x=S.users.find(x=>x.email===em&&x.pw===pw);if(!x)return err('Email or password is incorrect.')}
    S.session=em;save();toast('Signed in');const nx=next;next=null;location.hash='#'+(nx||'account');if(!nx)route()};
}
function route(){
  const r=(location.hash||'#home').slice(1);tabs(r);scrollTo(0,0);
  if(r==='home'||r==='shop')vHome();else if(r.startsWith('p-'))vProduct(r.slice(2));else if(r==='cart')vCart();
  else if(r==='checkout')vCheckout();else if(r==='orders')vOrders();else if(r==='account')vAccount();
  else if(r.startsWith('order-'))vOrder(r.slice(6));else if(r.startsWith('return-'))vReturn(r.slice(7));else vHome();
}
function addCart(id,n){const c=S.cart.find(x=>x.id==id);if(c)c.qty+=n;else S.cart.push({id:+id,qty:n});save();tabs((location.hash||'#home').slice(1))}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]');if(!t)return;const d=t.dataset;
  if(d.go){location.hash='#'+d.go;return}
  if(d.add){addCart(d.add,1);toast('Added to cart')}
  else if(d.addq){addCart(d.addq,qtyP);toast('Added to cart');qtyP=1}
  else if(d.buy){addCart(d.buy,qtyP);qtyP=1;location.hash='#checkout'}
  else if(d.qp){qtyP=Math.max(1,Math.min(9,qtyP+ +d.qp));$('#qp').textContent=qtyP}
  else if(d.cq){const c=S.cart.find(x=>x.id==d.cq);c.qty+=+d.d;if(c.qty<1)S.cart=S.cart.filter(x=>x!==c);save();tabs('cart');vCart()}
  else if(d.cat){cat=d.cat;vHome()}
  else if(d.clear!==undefined){q='';vHome()}
  else if(d.auth){authMode=d.auth;vAccount()}
  else if(d.out!==undefined){S.session=null;save();toast('Signed out');vAccount()}
  else if(d.adv){const o=S.orders.find(x=>x.id===d.adv);if(o.st<3)o.st++;save();vOrder(o.id)}
  else if(d.radv){const[oi,ri]=d.radv.split('|');const o=S.orders.find(x=>x.id===oi),r=o.returns.find(x=>x.id===ri);r.status=r.status==='Requested'?'Approved':'Refunded';save();if(r.status==='Refunded')toast(m(r.refund)+' refunded to card ending '+o.card);vOrder(oi)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=listHTML()}});
addEventListener('hashchange',route);route();
})();
</script>

</body></html>
